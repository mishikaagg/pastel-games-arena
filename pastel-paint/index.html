<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Paint</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← BACK TO ARENA</a>

        <div class="game-layout">
            <div class="left-panel">
                <header>
                    <h1><span>🎨</span> PASTEL PAINT <span>✨</span></h1>
                    <p class="subtitle">Draw with soft, beautiful colors!</p>
                </header>

                <div class="tools-panel">
                    <div class="tool-section">
                        <button id="galleryBtn" class="tool-btn gallery-btn">🎨 Choose Picture</button>
                    </div>

                    <div class="tool-section">
                        <label>Tools:</label>
                        <div class="tool-buttons">
                            <button id="brushTool" class="tool-icon-btn active" title="Brush">
                                🖌️
                            </button>
                            <button id="eraserTool" class="tool-icon-btn" title="Eraser">
                                ⬜
                            </button>
                            <button id="fillTool" class="tool-icon-btn" title="Fill Bucket">
                                🪣
                            </button>
                        </div>
                    </div>

                    <div class="tool-section">
                        <label>Colors:</label>
                        <div class="color-palette" id="colorPalette">
                            <!-- Colors will be generated by JavaScript -->
                        </div>
                    </div>

                    <div class="tool-section">
                        <label>Brush Size:</label>
                        <input type="range" id="brushSize" min="2" max="50" value="10" class="brush-slider">
                        <span id="brushSizeDisplay" class="brush-size-display">10px</span>
                    </div>

                    <div class="tool-section">
                        <div class="action-buttons">
                            <button id="undoBtn" class="tool-btn action-btn" title="Undo">↶ Undo</button>
                            <button id="redoBtn" class="tool-btn action-btn" title="Redo">↷ Redo</button>
                        </div>
                    </div>

                    <div class="tool-section">
                        <button id="clearBtn" class="tool-btn">Clear Canvas</button>
                        <button id="saveBtn" class="tool-btn">Save Drawing</button>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <canvas id="paintCanvas"></canvas>
            </div>
        </div>

        <!-- Picture Gallery Modal -->
        <div id="galleryModal" class="gallery-modal hidden">
            <div class="gallery-content">
                <div class="gallery-header">
                    <h2>🎨 Choose a Picture to Color</h2>
                    <button id="closeGallery" class="close-btn">×</button>
                </div>
                <div class="gallery-grid" id="galleryGrid">
                    <!-- Pictures will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>

</html>
