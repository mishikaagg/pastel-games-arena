<!DOCTYPE html>
<html>
<head>
    <title>Test Fill Tool</title>
</head>
<body>
    <canvas id="testCanvas" width="400" height="400" style="border: 1px solid black;"></canvas>
    <br>
    <button onclick="testFill()">Test Fill</button>
    <input type="color" id="fillColor" value="#FFB3D9">
    
    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        
        // Draw a white circle with black border
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 400, 400);
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(200, 200, 100, 0, Math.PI * 2);
        ctx.stroke();
        
        function testFill() {
            const fillColor = document.getElementById('fillColor').value;
            floodFill(200, 200, fillColor);
        }
        
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = canvas.width;
            const height = canvas.height;
            
            const fillR = parseInt(fillColor.slice(1, 3), 16);
            const fillG = parseInt(fillColor.slice(3, 5), 16);
            const fillB = parseInt(fillColor.slice(5, 7), 16);
            
            const x = Math.floor(startX);
            const y = Math.floor(startY);
            
            const startIdx = (y * width + x) * 4;
            const targetR = data[startIdx];
            const targetG = data[startIdx + 1];
            const targetB = data[startIdx + 2];
            
            if (targetR === fillR && targetG === fillG && targetB === fillB) {
                alert('Already filled with this color');
                return;
            }
            
            const stack = [[x, y]];
            const visited = new Uint8Array(width * height);
            const tolerance = 100;
            
            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                const idx = cy * width + cx;
                
                if (cx < 0 || cx >= width || cy < 0 || cy >= height) continue;
                if (visited[idx]) continue;
                
                const pos = idx * 4;
                const r = data[pos];
                const g = data[pos + 1];
                const b = data[pos + 2];
                
                const diff = Math.abs(r - targetR) + Math.abs(g - targetG) + Math.abs(b - targetB);
                
                if (diff <= tolerance * 3 || (targetR > 200 && targetG > 200 && targetB > 200 && (r + g + b) / 3 > 200)) {
                    visited[idx] = 1;
                    data[pos] = fillR;
                    data[pos + 1] = fillG;
                    data[pos + 2] = fillB;
                    data[pos + 3] = 255;
                    
                    stack.push([cx + 1, cy]);
                    stack.push([cx - 1, cy]);
                    stack.push([cx, cy + 1]);
                    stack.push([cx, cy - 1]);
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            alert('Fill complete!');
        }
    </script>
</body>
</html>
