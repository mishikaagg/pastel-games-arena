<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <a href="../index.html" class="back-link">← BACK TO ARENA</a>

        <div class="game-layout">
            <div class="left-panel">
                <header>
                    <h1><span>🧩</span> MEMORY MATCH <span>✨</span></h1>
                    <p class="subtitle">Memorize the cards and find all matching pairs!</p>
                </header>

                <div class="name-input-section">
                    <label for="playerName">Player Name:</label>
                    <input type="text" id="playerName" class="name-input" placeholder="Enter your name" maxlength="20">
                </div>

                <div class="difficulty-selector">
                    <label>Difficulty:</label>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                        <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                    </div>
                </div>

                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="stat-label">TIME</span>
                        <span id="timer" class="stat-value">0:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">MOVES</span>
                        <span id="moves" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">PAIRS</span>
                        <span id="pairs" class="stat-value">0/8</span>
                    </div>
                </div>

                <div id="statusMessage" class="status-message">Memorize the cards!</div>

                <div class="scoreboard-section">
                    <h3 class="scoreboard-title">🏆 Scoreboard</h3>
                    <div id="scoreboard" class="scoreboard-list">
                        <!-- Scores will be displayed here -->
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div id="cardGrid" class="card-grid">
                    <!-- Cards will be generated by JavaScript -->
                </div>
                <div id="pauseCloud" class="pause-cloud hidden">
                    <div class="cloud-content" id="pauseCloudText">☁️ Press spacebar to stop the timer</div>
                </div>
            </div>
        </div>

        <div id="winModal" class="win-modal hidden">
            <div class="win-content">
                <h2>🎉 YOU WIN! 🎉</h2>
                <div class="win-stats">
                    <p>Time: <span id="finalTime">0:00</span></p>
                    <p>Moves: <span id="finalMoves">0</span></p>
                </div>
                <button id="playAgainBtn" class="btn">PLAY AGAIN</button>
                <a href="../index.html" class="btn btn-secondary">BACK TO ARENA</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
